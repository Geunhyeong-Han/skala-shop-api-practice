spring:
  application:
    name: shop-api
  datasource:
    url: jdbc:h2:file:./data/shopdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  cookie-name: bff-access
  # 실습용 기본 키입니다. 운영 환경에서는 JWT_SECRET 환경 변수로 관리합니다.
  secret: ${JWT_SECRET:U0tBTEEtU0hPUC1KV1QtU0VDUkVULUtFWS0yMDI2ISE=}
  expiration-minutes: 60
